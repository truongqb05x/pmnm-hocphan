<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy tính cơ bản</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calculator-card {
            background-color: #fff;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            border: 1px solid #e1e4e8;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #495057;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px 12px;
            font-size: 16px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            background-color: #fff;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        .input-error {
            border-color: #e74c3c !important;
        }

        .error-message {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 5px;
            font-weight: 500;
        }

        .btn-calc {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background-color: #2980b9;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 5px;
        }

        .btn-calc:hover {
            background-color: #1f6391;
        }

        .result-box {
            margin-top: 25px;
            padding: 15px 20px;
            background-color: #eafaf1;
            border-left: 5px solid #2ecc71;
            border-radius: 4px;
            font-size: 18px;
            color: #27ae60;
        }

        .result-box strong {
            color: #1e824c;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <h2>Máy tính cơ bản</h2>
    <p class="subtitle">Chương 5 · Form và xử lý dữ liệu người dùng</p>

    <form method="POST" action="" novalidate>
        <!-- Số thứ nhất a -->
        <div class="form-group">
            <label for="a">Số thứ nhất (a):</label>
            <input type="text" id="a" name="a" value="{{ a }}" placeholder="Ví dụ: 5 hoặc 2,5" class="{% if errors.a %}input-error{% endif %}">
            {% if errors.a %}
                <div class="error-message">{{ errors.a }}</div>
            {% endif %}
        </div>

        <!-- Phép toán op -->
        <div class="form-group">
            <label for="op">Phép toán (op):</label>
            <select id="op" name="op" class="{% if errors.op %}input-error{% endif %}">
                <option value="+" {% if op == '+' %}selected{% endif %}>+</option>
                <option value="-" {% if op == '-' %}selected{% endif %}>-</option>
                <option value="*" {% if op == '*' %}selected{% endif %}>*</option>
                <option value="/" {% if op == '/' %}selected{% endif %}>/</option>
            </select>
            {% if errors.op %}
                <div class="error-message">{{ errors.op }}</div>
            {% endif %}
        </div>

        <!-- Số thứ hai b -->
        <div class="form-group">
            <label for="b">Số thứ hai (b):</label>
            <input type="text" id="b" name="b" value="{{ b }}" placeholder="Ví dụ: 3 hoặc 12.5" class="{% if errors.b %}input-error{% endif %}">
            {% if errors.b %}
                <div class="error-message">{{ errors.b }}</div>
            {% endif %}
        </div>

        <!-- Nút gửi form -->
        <button type="submit" class="btn-calc">Tính toán</button>
    </form>

    <!-- Hiển thị kết quả -->
    {% if result %}
        <div class="result-box">
            <strong>Kết quả:</strong> {{ result }}
        </div>
    {% endif %}
</div>

</body>
</html>
